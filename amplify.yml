# AWS Amplify build settings. This file at the repo root OVERRIDES the buildSpec
# stored in the Amplify console, so the deploy build is versioned with the code.
#
# ⚠️ Keep this file in sync with .github/workflows/ci.yml: both must install and
# build the same way (currently Bun + bun.lock). If you change the package
# manager, lockfile, or build command, update BOTH files in the same PR —
# otherwise CI stays green while production deploys fail. This exact failure
# happened in Aug 2026 (npm→Bun switch deleted package-lock.json while the
# Amplify console buildSpec still ran `npm ci`). See "Deployment" in CLAUDE.md.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Pinned install via the npm registry (integrity-checked) — do not
        # replace with `curl | bash`, which runs an unpinned remote script.
        - npm install -g bun@1.3.14
        - bun install --frozen-lockfile
    build:
      commands:
        - bun run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
